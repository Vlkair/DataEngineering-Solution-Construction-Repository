name: Run Data Engineering Pipeline

on:
  push:
    branches: [ "main" ]
  schedule:
    # Ejecuta el pipeline automáticamente todos los días a las 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite ejecutar el pipeline manualmente desde GitHub

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Pipeline ETL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python pipeline/main_flow.py